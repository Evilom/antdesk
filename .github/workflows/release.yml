name: Release

on:
  push:
    tags:
      - "AntDesk-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Get app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! gh release view "$TAG" --repo Evilom/antdesk >/dev/null 2>&1; then
            gh release create "$TAG" --repo Evilom/antdesk --title "AntDesk $TAG" --notes "See the assets below to download and install."
          fi

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            label: macos-arm64
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            label: macos-x64
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            label: windows-x64
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: "AntDesk v${{ needs.create-release.outputs.version }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Create updater bundles + collect sigs
        shell: bash
        run: |
          set -ex
          mkdir -p updater-artifacts

          # Find the bundle directory
          BUNDLE_DIR=$(find src-tauri/target -type d -name "bundle" | head -1)
          echo "Bundle dir: $BUNDLE_DIR"

          # macOS: already has .app.tar.gz + .sig
          for f in $(find "$BUNDLE_DIR" -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" 2>/dev/null); do
            echo "macOS: $f"
            cp "$f" updater-artifacts/
          done

          # Windows: compress -setup.exe into .nsis.zip + collect sig
          for exe in $(find "$BUNDLE_DIR" -name "*-setup.exe" 2>/dev/null); do
            NSIS_ZIP="${exe%-setup.exe}.nsis.zip"
            echo "Windows: compressing $exe -> $NSIS_ZIP"
            if command -v zip &>/dev/null; then
              (cd "$(dirname "$exe")" && zip -j "$(basename "$NSIS_ZIP")" "$(basename "$exe")")
            elif command -v 7z &>/dev/null; then
              7z a -tzip "$NSIS_ZIP" "$exe" >/dev/null
            elif command -v 7za &>/dev/null; then
              7za a -tzip "$NSIS_ZIP" "$exe" >/dev/null
            else
              # Use PowerShell Compress-Archive as fallback
              powershell -Command "Compress-Archive -Path '$exe' -DestinationPath '$NSIS_ZIP' -Force"
            fi
            cp "$NSIS_ZIP" updater-artifacts/
            # Copy the .exe.sig (same signature content)
            if [ -f "${exe}.sig" ]; then
              cp "${exe}.sig" "updater-artifacts/$(basename "$NSIS_ZIP").sig"
            fi
          done

          # Linux: compress .AppImage into .AppImage.tar.gz + collect sig
          for img in $(find "$BUNDLE_DIR" -name "*.AppImage" 2>/dev/null); do
            TAR_GZ="${img}.tar.gz"
            echo "Linux: compressing $img -> $TAR_GZ"
            tar czf "$TAR_GZ" -C "$(dirname "$img")" "$(basename "$img")"
            cp "$TAR_GZ" updater-artifacts/
            if [ -f "${img}.sig" ]; then
              cp "${img}.sig" "updater-artifacts/$(basename "$TAR_GZ").sig"
            fi
          done

          echo "=== Collected updater artifacts ==="
          ls -la updater-artifacts/

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.label }}
          path: updater-artifacts/
          if-no-files-found: warn

  updater-json:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all updater artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: updater-*
          merge-multiple: false

      - name: Generate latest.json and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          REPO="Evilom/antdesk"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          echo "=== Available artifacts ==="
          find all-artifacts -type f | sort

          python3 - "$VERSION" "$TAG" "$BASE_URL" << 'PYEOF'
          import json, os, sys, shutil

          version = sys.argv[1]
          tag = sys.argv[2]
          base_url = sys.argv[3]

          label_to_key = {
              "updater-macos-arm64": "darwin-aarch64",
              "updater-macos-x64": "darwin-x86_64",
              "updater-windows-x64": "windows-x86_64",
              "updater-linux-x64": "linux-x86_64",
          }

          platform_bundle_ext = {
              "darwin-aarch64": ".app.tar.gz",
              "darwin-x86_64": ".app.tar.gz",
              "windows-x86_64": ".nsis.zip",
              "linux-x86_64": ".AppImage.tar.gz",
          }

          os.makedirs("upload", exist_ok=True)
          platforms = {}

          for label, key in label_to_key.items():
              adir = os.path.join("all-artifacts", label)
              if not os.path.isdir(adir):
                  print(f"WARN: no dir {label}")
                  continue

              ext = platform_bundle_ext[key]
              bundle = sig = None
              for f in os.listdir(adir):
                  fp = os.path.join(adir, f)
                  if f.endswith(ext + ".sig"):
                      sig = fp
                  elif f.endswith(ext):
                      bundle = fp

              if not bundle or not sig:
                  print(f"WARN: {key} bundle={bundle} sig={sig}")
                  continue

              with open(sig) as f:
                  sig_content = f.read().strip()

              upload_name = os.path.basename(bundle)
              shutil.copy2(bundle, f"upload/{upload_name}")
              shutil.copy2(sig, f"upload/{upload_name}.sig")

              platforms[key] = {
                  "signature": sig_content,
                  "url": f"{base_url}/{upload_name}"
              }
              print(f"OK: {key} -> {upload_name}")

          if not platforms:
              print("ERROR: No platforms!")
              sys.exit(1)

          latest = {
              "version": version,
              "notes": f"AntDesk v{version}",
              "pub_date": "2026-01-01T00:00:00Z",
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          print(f"\nGenerated latest.json with {len(platforms)} platforms:")
          print(json.dumps(latest, indent=2))
          PYEOF

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"

          for f in upload/*; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            gh release upload "$TAG" "$f" --repo Evilom/antdesk --clobber || true
          done

          echo "Uploading latest.json to $TAG..."
          gh release upload "$TAG" latest.json --repo Evilom/antdesk --clobber || true
          echo "Updating updater release..."
          gh release delete-asset updater latest.json --repo Evilom/antdesk --yes 2>/dev/null || true
          gh release upload updater latest.json --repo Evilom/antdesk --clobber
          echo "Done!"
