name: Release

on:
  push:
    tags:
      - "AntDesk-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Get app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! gh release view "$TAG" --repo Evilom/antdesk >/dev/null 2>&1; then
            gh release create "$TAG" --repo Evilom/antdesk --title "AntDesk $TAG" --notes "See the assets below to download and install."
          fi

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            label: macos-arm64
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            label: macos-x64
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            label: windows-x64
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: "AntDesk v${{ needs.create-release.outputs.version }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  updater-json:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json from release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          REPO="Evilom/antdesk"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Get all release assets
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "=== Release assets ==="
          echo "$ASSETS"

          # Download only .sig files (tiny)
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --dir sigs --pattern "*.sig" --clobber

          python3 - "$VERSION" "$TAG" "$BASE_URL" << 'PYEOF'
          import json, os, sys, subprocess

          version, tag, base_url = sys.argv[1], sys.argv[2], sys.argv[3]

          # Get all release assets
          all_release = subprocess.run(
              ["gh", "release", "view", tag, "--repo", "Evilom/antdesk", "--json", "assets", "--jq", ".assets[].name"],
              capture_output=True, text=True
          ).stdout.strip().split("\n")
          print(f"Release assets: {all_release}")

          # Find the correct asset names for each platform
          def find_asset(match_fn):
              for f in all_release:
                  if match_fn(f):
                      return f
              return None

          platform_defs = {
              "darwin-aarch64": {
                  "bundle": lambda f: "aarch64" in f and f.endswith(".app.tar.gz") and not f.endswith(".sig"),
                  "sig": lambda f: "aarch64" in f and f.endswith(".app.tar.gz.sig"),
              },
              "darwin-x86_64": {
                  "bundle": lambda f: ("x64" in f or "x86_64" in f) and f.endswith(".app.tar.gz") and not f.endswith(".sig"),
                  "sig": lambda f: ("x64" in f or "x86_64" in f) and f.endswith(".app.tar.gz.sig"),
              },
              "windows-x86_64": {
                  "bundle": lambda f: "setup" in f and f.endswith(".exe") and not f.endswith(".sig"),
                  "sig": lambda f: "setup" in f and f.endswith(".exe.sig"),
              },
              "linux-x86_64": {
                  "bundle": lambda f: f.endswith(".AppImage") and not f.endswith(".sig"),
                  "sig": lambda f: f.endswith(".AppImage.sig"),
              },
          }

          platforms = {}
          for key, matchers in platform_defs.items():
              bundle_name = find_asset(matchers["bundle"])
              sig_name = find_asset(matchers["sig"])

              if not bundle_name or not sig_name:
                  print(f"WARN: {key} — bundle={bundle_name}, sig={sig_name}")
                  continue

              with open(f"sigs/{sig_name}") as f:
                  sig_content = f.read().strip()

              platforms[key] = {
                  "signature": sig_content,
                  "url": f"{base_url}/{bundle_name}"
              }
              print(f"OK: {key} -> {bundle_name}")

          if not platforms:
              print("ERROR: No platforms found!")
              sys.exit(1)

          latest = {
              "version": version,
              "notes": f"AntDesk v{version}",
              "pub_date": "2026-01-01T00:00:00Z",
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          print(f"\nGenerated latest.json with {len(platforms)} platforms:")
          print(json.dumps(latest, indent=2))
          PYEOF

      - name: Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          echo "Uploading latest.json to $TAG..."
          gh release upload "$TAG" latest.json --repo Evilom/antdesk --clobber || true
          echo "Updating updater release..."
          gh release delete-asset updater latest.json --repo Evilom/antdesk --yes 2>/dev/null || true
          gh release upload updater latest.json --repo Evilom/antdesk --clobber
          echo "Done!"
