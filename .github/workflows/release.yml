name: Release

on:
  push:
    tags:
      - "AntDesk-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! gh release view "$TAG" --repo Evilom/antdesk >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --repo Evilom/antdesk \
              --title "AntDesk $TAG" \
              --notes "See the assets below to download and install." \
              --draft=false \
              --prerelease=false
          else
            echo "Release $TAG already exists, skipping."
          fi

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            label: macos-arm64
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            label: macos-x64
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            label: windows-x64
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: "AntDesk v${{ needs.create-release.outputs.version }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Collect updater artifacts
        shell: bash
        run: |
          set -ex
          mkdir -p updater-artifacts

          # Find ALL updater bundles and their sig files
          find src-tauri/target \( \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "*.nsis.zip" -o \
            -name "*.nsis.zip.sig" -o \
            -name "*.AppImage.tar.gz" -o \
            -name "*.AppImage.tar.gz.sig" \
          \) -print0 | while IFS= read -r -d '' f; do
            echo "Found: $f"
            cp "$f" updater-artifacts/
          done

          echo "=== Collected ==="
          ls -la updater-artifacts/ || echo "WARNING: No updater artifacts!"

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.label }}
          path: updater-artifacts/
          if-no-files-found: warn

  updater-json:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all updater artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: updater-*
          merge-multiple: false

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -e
          TAG="v${VERSION}"
          REPO="Evilom/antdesk"

          echo "=== Available sig files ==="
          find all-artifacts -name "*.sig" | sort

          echo ""
          echo "=== Release assets ==="
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'

          python3 << 'PYEOF'
          import json, os, subprocess

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          # Get actual release asset names
          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "assets", "--jq", ".assets[].name"],
              capture_output=True, text=True
          )
          release_assets = result.stdout.strip().split("\n")
          print(f"Release assets: {release_assets}")

          # Map platform key to patterns for matching release assets
          platform_release_patterns = {
              "darwin-aarch64": lambda n: "aarch64" in n.lower() and n.endswith(".app.tar.gz") and not n.endswith(".sig"),
              "darwin-x86_64": lambda n: ("x64" in n.lower() or "x86_64" in n.lower()) and n.endswith(".app.tar.gz") and not n.endswith(".sig"),
              "windows-x86_64": lambda n: n.endswith(".nsis.zip") and not n.endswith(".sig"),
              "linux-x86_64": lambda n: n.endswith(".AppImage.tar.gz") and not n.endswith(".sig"),
          }

          # Map platform key to patterns for matching artifact sig files
          platform_sig_patterns = {
              "darwin-aarch64": lambda n: n.endswith(".app.tar.gz.sig"),
              "darwin-x86_64": lambda n: n.endswith(".app.tar.gz.sig"),
              "windows-x86_64": lambda n: n.endswith(".nsis.zip.sig"),
              "linux-x86_64": lambda n: n.endswith(".AppImage.tar.gz.sig"),
          }

          # Artifact directory mapping
          label_to_key = {
              "updater-macos-arm64": "darwin-aarch64",
              "updater-macos-x64": "darwin-x86_64",
              "updater-windows-x64": "windows-x86_64",
              "updater-linux-x64": "linux-x86_64",
          }

          platforms = {}
          os.makedirs("upload", exist_ok=True)

          for platform_key, match_fn in platform_release_patterns.items():
              # Find the bundle name in release assets
              bundle_name = None
              for asset in release_assets:
                  if match_fn(asset):
                      bundle_name = asset
                      break

              if not bundle_name:
                  print(f"WARN: No release asset for {platform_key}")
                  continue

              # Find the matching sig file in artifacts
              # macOS: both arm64 and x64 have same filename (AntDesk.app.tar.gz.sig)
              # Need to look in the correct artifact directory
              artifact_label = [k for k, v in label_to_key.items() if v == platform_key]
              if not artifact_label:
                  print(f"WARN: No artifact label for {platform_key}")
                  continue

              artifact_dir = os.path.join("all-artifacts", artifact_label[0])
              sig_content = None
              sig_path = None

              if os.path.isdir(artifact_dir):
                  for root, dirs, files in os.walk(artifact_dir):
                      for f in files:
                          if platform_sig_patterns[platform_key](f):
                              sig_path = os.path.join(root, f)
                              with open(sig_path) as sf:
                                  sig_content = sf.read().strip()
                              break

              if not sig_content:
                  print(f"WARN: No sig for {platform_key} (bundle: {bundle_name})")
                  continue

              # Upload sig file to release with matching name
              sig_upload_name = bundle_name + ".sig"
              with open(f"upload/{sig_upload_name}", "w") as sf:
                  sf.write(sig_content)

              platforms[platform_key] = {
                  "signature": sig_content,
                  "url": f"{base_url}/{bundle_name}"
              }
              print(f"OK: {platform_key} -> {bundle_name}")

          if not platforms:
              print("\nERROR: No platforms found!")
              exit(1)

          latest = {
              "version": version,
              "notes": f"AntDesk v{version}",
              "pub_date": "2026-01-01T00:00:00Z",
              "platforms": platforms
          }

          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)

          print(f"\nGenerated latest.json with {len(platforms)} platforms:")
          print(json.dumps(latest, indent=2))
          PYEOF

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          TAG="v${VERSION}"

          # Upload .sig files to release
          for f in upload/*.sig; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f) to $TAG..."
            gh release upload "$TAG" "$f" --repo Evilom/antdesk --clobber || true
          done

          # Upload latest.json to both releases
          echo "Uploading latest.json to $TAG..."
          gh release upload "$TAG" latest.json --repo Evilom/antdesk --clobber || true
          echo "Uploading latest.json to updater release..."
          gh release delete-asset updater latest.json --repo Evilom/antdesk --yes 2>/dev/null || true
          gh release upload updater latest.json --repo Evilom/antdesk --clobber
          echo "Done!"
