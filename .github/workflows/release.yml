name: Release

on:
  push:
    tags:
      - "AntDesk-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! gh release view "$TAG" --repo Evilom/antdesk >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --repo Evilom/antdesk \
              --title "AntDesk $TAG" \
              --notes "See the assets below to download and install." \
              --draft=false \
              --prerelease=false
          else
            echo "Release $TAG already exists, skipping creation."
          fi

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            label: macos-arm64
            updater_key: darwin-aarch64
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            label: macos-x64
            updater_key: darwin-x86_64
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            label: windows-x64
            updater_key: windows-x86_64
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            label: linux-x64
            updater_key: linux-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Get app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: "AntDesk v${{ needs.create-release.outputs.version }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Collect updater artifacts
        shell: bash
        run: |
          mkdir -p updater-artifacts
          find src-tauri/target -name "*.app.tar.gz" -o -name "*.nsis.zip" -o -name "*.AppImage.tar.gz" -o -name "*.app.tar.gz.sig" -o -name "*.nsis.zip.sig" -o -name "*.AppImage.tar.gz.sig" | while read f; do
            cp "$f" updater-artifacts/
          done
          echo "=== Collected artifacts ==="
          ls -la updater-artifacts/

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.label }}
          path: updater-artifacts/
          if-no-files-found: warn

  updater-json:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Download all updater artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: updater-*
          merge-multiple: false

      - name: Generate latest.json and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export VERSION="${{ needs.create-release.outputs.version }}"
          export TAG="v${VERSION}"
          export REPO="Evilom/antdesk"
          export BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          echo "=== Artifact structure ==="
          find all-artifacts -type f | sort

          mkdir -p merged
          for dir in all-artifacts/updater-*/; do
            cp "$dir"* merged/ 2>/dev/null || true
          done
          echo "=== Merged ==="
          ls -la merged/

          python3 << 'PYEOF'
          import json, os, glob, shutil

          version = os.environ["VERSION"]
          base_url = os.environ["BASE_URL"]
          tag = os.environ["TAG"]

          platforms = {}

          for artifact_dir in sorted(glob.glob("all-artifacts/updater-*")):
              label = os.path.basename(artifact_dir)

              if "macos-arm64" in label:
                  platform_key = "darwin-aarch64"
              elif "macos-x64" in label:
                  platform_key = "darwin-x86_64"
              elif "windows" in label:
                  platform_key = "windows-x86_64"
              elif "linux" in label:
                  platform_key = "linux-x86_64"
              else:
                  continue

              bundles = []
              sigs = []
              for root, dirs, files in os.walk(artifact_dir):
                  for f in files:
                      fp = os.path.join(root, f)
                      if f.endswith(".sig"):
                          sigs.append(fp)
                      elif any(f.endswith(ext) for ext in [".app.tar.gz", ".nsis.zip", ".AppImage.tar.gz"]):
                          bundles.append(fp)

              if not bundles:
                  print(f"WARN: No bundle for {platform_key} in {label}")
                  continue

              bundle_path = bundles[0]
              bundle_name = os.path.basename(bundle_path)

              if platform_key.startswith("darwin"):
                  upload_name = f"AntDesk_{platform_key.replace('darwin-', '')}.app.tar.gz"
              else:
                  upload_name = bundle_name

              sig_content = ""
              sig_path = bundle_path + ".sig"
              if os.path.exists(sig_path):
                  with open(sig_path) as f:
                      sig_content = f.read().strip()
              elif sigs:
                  with open(sigs[0]) as f:
                      sig_content = f.read().strip()

              if not sig_content:
                  print(f"WARN: No signature for {platform_key}")
                  continue

              os.makedirs("upload", exist_ok=True)
              shutil.copy2(bundle_path, f"upload/{upload_name}")

              platforms[platform_key] = {
                  "signature": sig_content,
                  "url": f"{base_url}/{upload_name}"
              }
              print(f"OK: {platform_key} -> {upload_name}")

          if not platforms:
              print("ERROR: No platforms found!")
              exit(1)

          latest = {
              "version": version,
              "notes": f"AntDesk {tag}",
              "pub_date": "2026-01-01T00:00:00Z",
              "platforms": platforms
          }

          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)

          print(f"\nGenerated latest.json with {len(platforms)} platforms")
          PYEOF

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          TAG="v${VERSION}"
          for f in upload/*; do
            echo "Uploading $(basename $f) to $TAG..."
            gh release upload "$TAG" "$f" --repo Evilom/antdesk --clobber || true
          done
          echo "Uploading latest.json to $TAG..."
          gh release upload "$TAG" latest.json --repo Evilom/antdesk --clobber || true
          echo "Uploading latest.json to updater release..."
          gh release delete-asset updater latest.json --repo Evilom/antdesk --yes 2>/dev/null || true
          gh release upload updater latest.json --repo Evilom/antdesk --clobber
