name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install deps
        run: yarn install

      - name: Build macOS app
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find macOS output
        run: |
          Get-ChildItem -Path src-tauri/target -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'bundle' -or $_.Name -like '*.app' } |
            ForEach-Object {
              Write-Host $_.FullName
              Get-ChildItem $_.FullName -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table
            }

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: antdesk-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/*.app
          retention-days: 14

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install deps
        run: yarn install

      - name: Build Windows exe
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Windows output
        run: |
          Get-ChildItem -Path src-tauri/target -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'bundle' -or $_.Name -like '*.exe' } |
            ForEach-Object {
              Write-Host $_.FullName
              Get-ChildItem $_.FullName -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table
            }

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: antdesk-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
          retention-days: 14
