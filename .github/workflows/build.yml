name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: installers-${{ matrix.label }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: yarn
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Test voice and pet behavior
        run: node --test tests/chat.test.mjs tests/realtime-client.test.mjs tests/pet.test.mjs
      - name: Test native storage and boundaries
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installers
        shell: bash
        run: yarn tauri build --target '${{ matrix.target }}' --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AntDesk-${{ matrix.label }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
